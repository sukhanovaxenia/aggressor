{% set name = "aggressor-mutagenesis" %}
{% set version = "0.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # For a real bioconda submission, point url/sha256 at the PyPI sdist:
  url: url: https://pypi.io/packages/source/a/aggressor-mutagenesis/aggressor_mutagenesis-0.2.0.tar.gz
  sha256: 7d84077422e05e9c38687ea8c6012b63f14326d04ce36f85d8fd7d64450ab9cb

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - aggressor = aggressor.cli.app:main

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=68
  run:
    - python >=3.10

test:
  imports:
    - aggressor
  commands:
    - aggressor --version

about:
  home: https://github.com/your-org/aggressor
  license: MIT
  license_file: LICENSE
  summary: Aggregation-Guided Generation of REgion-Specific Substitution ORiented mutations
  dev_url: https://github.com/your-org/aggressor

extra:
  recipe-maintainers:
    - your-github-handle
