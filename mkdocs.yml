site_name: AGGRESSOR
site_description: Aggregation-Guided Generation of REgion-Specific Substitution ORiented mutations
repo_url: https://github.com/your-org/aggressor
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
    - toc.integrate
  palette:
    - scheme: default
      primary: teal
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      primary: teal
      toggle: { icon: material/weather-sunny, name: Light mode }

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            members_order: source

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - toc: { permalink: true }

nav:
  - Home: index.md
  - Usage: usage.md
  - Biology & methods: biology.md
  - API reference: api.md
